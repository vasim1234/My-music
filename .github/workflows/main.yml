name: Build Flutter APK
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'
          cache: true

      - name: Create Android project
        run: |
          rm -rf android
          flutter create --platforms=android --project-name=my_music --org=com.music.app .

      - name: Fix Android SDK
        run: |
          sed -i 's/compileSdkVersion 35/compileSdkVersion 33/g' android/app/build.gradle
          sed -i 's/targetSdkVersion 35/targetSdkVersion 33/g' android/app/build.gradle
          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties

      - name: Install dependencies
        run: flutter pub get
      
      - name: Check pubspec.yaml
        run: |
          cat pubspec.yaml
          if ! grep -q "sdk:" pubspec.yaml; then
          echo "ERROR: pubspec.yaml missing SDK constraint"
          exit 1
          fi
      - name: Generate Android Launcher Icons
        run: |
          # Sirf Android ke liye icon generate karein
          flutter pub run flutter_launcher_icons

      - name: Build APK
        run: flutter build apk --release

      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v1
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          tag_name: v1.0.${{ github.run_number }}
          name: "My-Music App v1.0.${{ github.run_number }}"
          body: |
            🎵 Naya APK ready hai!
            
            ## ✨ Features:
            - 🎵 3D Sound Effect
            - 🎚️ Equalizer
            - ⏰ Sleep Timer
            - 📁 Custom Playlists
            - ❤️ Favorites & Recent
            - 🎨 Neon Dark Theme
            
            📱 Download: https://github.com/${{ github.repository }}/releases/tag/v1.0.${{ github.run_number }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: my_music
description: A 3D Music Player App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^5.2.1
  file_picker: ^6.1.1
  cupertino_icons: ^1.0.6
  shared_preferences: ^2.2.2
  flutter_native_splash: ^2.3.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

flutter_native_splash:
  color: "#0A0A0F"
  image: assets/splash/logo.png
  android: true
  ios: false
  android_gravity: center
  color_dark: "#0A0A0F"
  image_dark: assets/splash/logo.png
  
  android_12:
    color: "#0A0A0F"
    image: assets/splash/logo.png
    color_dark: "#0A0A0F"
    image_dark: assets/splash/logo.png
